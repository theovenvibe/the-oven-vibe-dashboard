  /* ---------- aggregations ---------- */

  function weeks(rows) {
    const map = new Map();
    rows.forEach(function (o) {
      const key = o.week.getTime();
      if (!map.has(key)) map.set(key, { start: o.week, rows: [] });
      map.get(key).rows.push(o);
    });
    // Keep empty weeks so gaps in trading read as gaps, not as continuity.
    const out = [];
    if (!map.size) return out;
    const keys = Array.from(map.keys()).sort(function (a, b) { return a - b; });
    for (let t = keys[0]; t <= keys[keys.length - 1]; t += 7 * DAY_MS) {
      out.push(map.get(t) || { start: new Date(t), rows: [] });
    }
    return out;
  }

  function metrics(rows) {
    const delivered = rows.filter(function (o) { return o.delivered; });
    const revenue = sum(delivered.map(function (o) { return o.total; }));
    const customers = new Set(rows.map(function (o) { return o.customer_id; }));
    const counts = new Map();
    rows.forEach(function (o) { counts.set(o.customer_id, (counts.get(o.customer_id) || 0) + 1); });
    let repeat = 0;
    counts.forEach(function (c) { if (c > 1) repeat++; });
    const rated = rows.filter(function (o) { return o.rating != null; });
    return {
      orders: rows.length,
      delivered: delivered.length,
      revenue: revenue,
      aov: delivered.length ? revenue / delivered.length : null,
      fulfilment: rows.length ? delivered.length / rows.length : null,
      rating: mean(rated.map(function (o) { return o.rating; })),
      ratedCount: rated.length,
      kpt: mean(rows.map(function (o) { return o.kpt_duration_min; })),
      riderWait: mean(rows.map(function (o) { return o.rider_wait_min; })),
      discount: sum(rows.map(function (o) { return o.discount; })),
      customers: customers.size,
      repeatRate: customers.size ? repeat / customers.size : null,
      itemsPerOrder: rows.length
        ? sum(rows.map(function (o) { return sum(o.lines.map(function (l) { return l.quantity || 0; })); })) / rows.length
        : null
    };
  }

  function countBy(rows, keyFn) {
    const map = new Map();
    rows.forEach(function (o) {
      const k = keyFn(o);
      if (k == null) return;
      map.set(k, (map.get(k) || 0) + 1);
    });
    return map;
  }

  /* ---------- view ---------- */

  function tile(label, value, foot) {
    const box = el("div", { class: "tile" });
    box.appendChild(el("div", { class: "label" }, label));
    box.appendChild(el("div", { class: "value" }, value));
    box.appendChild(el("div", { class: "foot" }, foot || " "));
    return box;
  }

  function heroBlock(label, figure, deltaNode) {
    const hero = el("div", { class: "hero" });
    const box = el("div");
    box.appendChild(el("div", { class: "label" }, label));
    box.appendChild(el("div", { class: "figure" }, figure));
    hero.appendChild(box);
    if (deltaNode) hero.appendChild(deltaNode);
    return hero;
  }

  function wdIndex(w) {
    return typeof w === "number" ? w : WEEKDAYS.indexOf(w);
  }

  function itemShortName(name) {
    return name.replace(/\s*\[[^\]]*\]\s*$/, "").trim();
  }

  // trend_pct arrives already in percent units (-85.71 means -86%), so it is
  // formatted directly rather than through pct(), which scales by 100.
  // analytics.py nulls it below a meaningful base (a swing from 3 units to 0
  // prints as a nonsense percentage); fall back to the raw before/after unit
  // counts it carries instead. Defensive: those fields may not be in the
  // payload yet.
  function trendCellText(mrow) {
    if (!mrow) return "—";
    if (mrow.trend_pct != null) {
      const v = Math.round(mrow.trend_pct);
      return (v > 0 ? "+" : "") + v + "%";
    }
    if (mrow.trend_units_prior != null && mrow.trend_units_recent != null) {
      return mrow.trend_units_prior + " → " + mrow.trend_units_recent + " units";
    }
    return "—";
  }

  /* ---------- Plan ---------- */

  function renderPlan(body, rows) {
    if (!A) {
      body.appendChild(heroBlock("Next week's forecast", "—"));
      body.appendChild(emptyCard("Plan", "Forecast, actions, prep plan and closure options."));
      return;
    }
    const dq = dataQualityPanel();
    if (dq) body.appendChild(dq);

    const dvzCard = directVsZomatoCard();
    if (dvzCard) body.appendChild(dvzCard);

    const f = A.forecast || {};
    body.appendChild(heroBlock(
      "Forecast for the week of " + (f.week_start ? shortDate(new Date(f.week_start)) : "—"),
      moneyExact(f.revenue_expected),
      el("div", { class: "delta" },
        num(f.orders_expected, 1) + " orders expected (" + num(f.orders_low, 0) + "–" + num(f.orders_high, 0) + ") · " + (f.method || ""))
    ));
    body.appendChild(quietNote());

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    const wk = weeks(rows);
    const wkEvery = Math.max(1, Math.ceil(wk.length / 8));
    const historyCard = card("Where we've been", "Delivered revenue by week — scoped to the filters above.", "full");
    historyCard.appendChild(columnChart({
      rows: wk.map(function (w) {
        const wm = metrics(w.rows);
        return {
          label: shortDate(w.start), value: wm.revenue, tipHead: "Week of " + longDate(w.start),
          tipRows: [
            { value: moneyExact(wm.revenue), name: "revenue", color: "var(--series-1)" },
            { value: String(wm.orders), name: "orders" }
          ]
        };
      }),
      fmt: money, labelEvery: wkEvery
    }));
    grid.appendChild(historyCard);

    const fcCard = card("Forecast by weekday", "Recency-weighted mean of the last 4 same weekdays; the whisker on each column is its ±1 standard deviation range.", "full");
    fcCard.appendChild(forecastBandChart({
      rows: (f.by_weekday || []).map(function (w) {
        return {
          label: w.weekday, expected: w.orders_expected, low: w.orders_low, high: w.orders_high,
          tipHead: w.weekday,
          tipRows: [
            { value: num(w.orders_expected, 1) + " orders", color: "var(--series-1)" },
            { value: num(w.orders_low, 1) + "–" + num(w.orders_high, 1), name: "range" },
            { value: moneyExact(w.revenue_expected), name: "revenue" }
          ]
        };
      }),
      fmt: function (v) { return num(v, 0); }
    }));
    grid.appendChild(fcCard);

    const actionsCard = card("Ranked actions", "Impact is a monthly rupee estimate; confidence reflects sample size honestly.", "full");
    const list = el("div", { class: "actions-list" });
    (A.actions || []).forEach(function (a) { list.appendChild(actionCard(a)); });
    if (!(A.actions || []).length) actionsCard.appendChild(el("p", { class: "empty" }, "No ranked actions in this build."));
    actionsCard.appendChild(list);
    grid.appendChild(actionsCard);

    const prep = A.demand && A.demand.prep_plan || [];
    const prepHours = Array.from(new Set(prep.map(function (p) { return p.hour; }))).sort(function (a, b) { return a - b; });
    const prepCard = card("Prep-hour plan", "Expected orders by weekday and hour — staff to this shape, not to the daily average.", "full");
    const prepMax = prep.length ? Math.max.apply(null, prep.map(function (p) { return p.orders_expected || 0; })) : 0;
    prepCard.appendChild(heatmapLegend("Orders expected", prepMax, function (v) { return num(v, 1); }));
    prepCard.appendChild(heatmapChart({
      cells: prep.map(function (p) {
        const wi = wdIndex(p.weekday);
        return {
          weekday: wi, hour: p.hour, value: p.orders_expected,
          tipHead: WEEKDAYS[wi] + " " + hourLabel(p.hour),
          tipRows: [{ value: num(p.orders_expected, 1) + " orders expected", color: "var(--series-1)" }]
        };
      }),
      hours: prepHours
    }));
    grid.appendChild(prepCard);

    const closure = A.demand && A.demand.closure_options || [];
    const closureCard = card("Kitchen-closure options", "When you can shut the kitchen for maintenance without losing meaningful revenue. Five best per scope; a weekday carrying a peak window is never recommended.", "full");
    ["weekly", "weekday", "monthly"].forEach(function (scope) {
      closureCard.appendChild(el("p", { class: "eyebrow", style: "margin-top:14px" }, scope));
      closureCard.appendChild(closureOptionsTable(closure, scope));
    });
    grid.appendChild(closureCard);
  }

  /* ---------- Menu ---------- */

  function renderMenu(body, rows) {
    if (!A) { body.appendChild(emptyCard("Menu", "Item matrix, table, price and drop candidates.")); return; }
    const menuAll = A.menu || [];
    const priceByName = new Map((A.prices || []).map(function (p) { return [p.item_name, p]; }));
    const menuByName = new Map(menuAll.map(function (m) { return [m.item_name, m]; }));
    // A "dog" is never a drop candidate if it appears in a pair with n >= 3 — computed
    // from the pairs list rather than trusting a precomputed field on the menu row.
    const frequentAttachment = new Set();
    (A.pairs || []).forEach(function (p) { if (p.n >= 3) { frequentAttachment.add(p.a); frequentAttachment.add(p.b); } });

    const categories = Array.from(new Set(menuAll.map(function (m) { return m.category; }).filter(Boolean))).sort();
    const menu = state.menuCategory === "all" ? menuAll : menuAll.filter(function (m) { return m.category === state.menuCategory; });

    const topRev = menuAll.slice().sort(function (a, b) { return b.revenue - a.revenue; })[0];
    body.appendChild(heroBlock(
      "Revenue concentration",
      topRev ? pct(topRev.revenue_share, 0) : "—",
      el("div", { class: "delta" }, topRev ? itemShortName(topRev.item_name) + " alone is " + pct(topRev.revenue_share, 0) + " of item revenue" : "")
    ));
    body.appendChild(quietNote());
    const psl = priceSourceLine();
    if (psl) body.appendChild(psl);
    const catChips = categoryChips(categories, "menuCategory");
    if (catChips) body.appendChild(catChips);

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    const priced = menu.filter(function (m) { return m.unit_price != null; });
    const unitsMedian = median(priced.map(function (m) { return m.units; }));
    const priceMedian = median(priced.map(function (m) { return m.unit_price; }));
    // "True outliers" — items genuinely far from the pack in the matrix
    // (normalized distance from the median on both axes), not simply the
    // highest-revenue dots, which cluster together and collide as labels.
    const maxUnits = Math.max.apply(null, priced.map(function (m) { return m.units; })) || 1;
    const maxPrice = Math.max.apply(null, priced.map(function (m) { return m.unit_price; })) || 1;
    const extremity = function (m) {
      return Math.abs(m.units - unitsMedian) / maxUnits + Math.abs(m.unit_price - priceMedian) / maxPrice;
    };
    const outlierNames = new Set(
      priced.slice()
        .sort(function (a, b) { return extremity(b) - extremity(a); })
        .filter(function (m) { return extremity(m) > 0.25; })
        .slice(0, 6)
        .map(function (m) { return m.item_name; })
    );

    // "Hot" is recency, not size: sold inside the last fortnight AND selling at
    // or above the median. A big cold bubble is an item that used to work, and
    // that is a different problem from one that is working now -- so it gets a
    // ring rather than a colour, which would have overwritten the quadrant.
    const HOT_DAYS = 14;
    const isHot = function (m) { return m.days_dormant != null && m.days_dormant <= HOT_DAYS && m.units >= unitsMedian; };
    const QUAD_COLOR = {
      star: "var(--quad-star)",
      plowhorse: "var(--quad-plowhorse)",
      puzzle: "var(--quad-puzzle)",
      dog: "var(--quad-dog)"
    };
    const QUAD_MEANING = {
      star: "sells a lot, priced above median",
      plowhorse: "sells a lot, priced below median",
      puzzle: "priced above median, barely sells",
      dog: "below median on both"
    };
    const hotCount = priced.filter(isHot).length;

    const matrixCard = card("Menu matrix", "Units × price. Bubble area is revenue, colour is the quadrant, and a dashed ring means the item sold inside the last " + HOT_DAYS + " days. No cost data exists, so this is price, never margin.", "full");
    matrixCard.appendChild(legend(
      ["star", "plowhorse", "puzzle", "dog"].map(function (q) {
        const n = priced.filter(function (m) { return m.quadrant === q; }).length;
        return { color: QUAD_COLOR[q], name: q + " · " + n + " — " + QUAD_MEANING[q] };
      })
    ));
    matrixCard.appendChild(el("p", { class: "forecast-method" },
      "Bubble area is revenue — the biggest bubble is " + (topRev ? itemShortName(topRev.item_name) + " at " + moneyExact(topRev.revenue) : "—") + ". " +
      (hotCount ? hotCount + " item" + (hotCount === 1 ? " has" : "s have") + " a dashed ring: sold in the last " + HOT_DAYS + " days and at or above median units."
                : "No item is currently hot — nothing sold inside the last " + HOT_DAYS + " days at or above median units.")));
    matrixCard.appendChild(scatterChart({
      points: priced.map(function (m) {
        return {
          x: m.units, y: m.unit_price, revenue: m.revenue, label: itemShortName(m.item_name),
          outlier: outlierNames.has(m.item_name),
          color: QUAD_COLOR[m.quadrant] || "var(--text-muted)",
          hot: isHot(m),
          tipHead: itemShortName(m.item_name),
          tipRows: [
            { value: m.units + " units", color: QUAD_COLOR[m.quadrant] || "var(--series-1)" },
            { value: moneyExact(m.unit_price), name: "unit price (" + m.price_confidence + ")" },
            { value: moneyExact(m.revenue), name: "revenue" },
            { value: m.quadrant + (isHot(m) ? " · hot" : ""), name: "quadrant" },
            { value: m.days_dormant != null ? m.days_dormant + " days" : "—", name: "since last sale" }
          ]
        };
      }),
      xMedian: unitsMedian, yMedian: priceMedian,
      xTitle: "units sold", yTitle: "unit price (₹)",
      fmtX: function (v) { return num(v, 0); }, fmtY: money,
      quadrantNames: { tr: "star", tl: "puzzle", br: "plowhorse", bl: "dog" }
    }));
    grid.appendChild(matrixCard);

    const priceUp = menu.filter(function (m) { return m.quadrant === "plowhorse"; }).sort(function (a, b) { return b.units - a.units; }).slice(0, 8);
    const priceCard = card("Price-rise candidates", "High demand, priced below the median — plowhorses.");
    priceCard.appendChild(priceUp.length
      ? barChart({
          rows: priceUp.map(function (m) { return { label: itemShortName(m.item_name), value: m.units, tipRows: [
            { value: m.units + " units", color: "var(--series-1)" },
            { value: moneyExact(m.unit_price), name: "current price" }
          ] }; }),
          fmt: function (v) { return num(v); }, compact: true
        })
      : el("p", { class: "empty" }, "No plowhorse items in range."));
    grid.appendChild(priceCard);

    const drop = menu.filter(function (m) { return m.quadrant === "dog" && !frequentAttachment.has(m.item_name); }).sort(function (a, b) { return b.days_dormant - a.days_dormant; }).slice(0, 8);
    const dropCard = card("Drop candidates", "Low demand, low price, ranked by days since last sale. Items that attach to a pair (n ≥ 3) are exempted here — see why in the item table.");
    dropCard.appendChild(drop.length
      ? barChart({
          rows: drop.map(function (m) { return { label: itemShortName(m.item_name), value: m.days_dormant, tipRows: [
            { value: m.days_dormant + " days dormant", color: "var(--series-2)" },
            { value: m.units + " units lifetime", name: "" }
          ] }; }),
          fmt: function (v) { return num(v) + "d"; }, color: "var(--series-2)", compact: true
        })
      : el("p", { class: "empty" }, "No drop candidates in range."));
    grid.appendChild(dropCard);

    const dormant = (A.dormant || []).slice(0, 12);
    const dormantCard = card("Dormant / revive", "Sold steadily once, then stopped — check listing status before writing these off.", "full");
    if (dormant.length) {
      const scroll = el("div", { class: "scroll" });
      const table = el("table");
      const head = el("tr");
      ["Item", "Units lifetime", "Last sold", "Days dormant", "Weekly rate when active", "Est. lost revenue"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(el("thead")).appendChild(head);
      const tbody = el("tbody");
      dormant.forEach(function (d) {
        const tr = el("tr");
        tr.appendChild(el("td", { style: "text-align:left" }, itemShortName(d.item_name)));
        tr.appendChild(el("td", null, String(d.units_lifetime)));
        tr.appendChild(el("td", null, shortDate(new Date(d.last_sold))));
        tr.appendChild(el("td", null, String(d.days_dormant)));
        tr.appendChild(el("td", null, num(d.weekly_rate_when_active, 2)));
        tr.appendChild(el("td", null, moneyExact(d.estimated_lost_revenue)));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      dormantCard.appendChild(scroll);
    } else {
      dormantCard.appendChild(el("p", { class: "empty" }, "Nothing dormant in this build."));
    }
    grid.appendChild(dormantCard);

    /* item table — units/orders/revenue scoped to the filters; quadrant/trend/sparkline are full history */
    const itemQty = new Map(), itemOrders = new Map();
    rows.forEach(function (o) {
      o.lines.forEach(function (l) {
        itemQty.set(l.item_name, (itemQty.get(l.item_name) || 0) + (l.quantity || 0));
        itemOrders.set(l.item_name, (itemOrders.get(l.item_name) || 0) + 1);
      });
    });
    const itemNames = Array.from(itemQty.keys())
      .filter(function (n) { return state.menuCategory === "all" || (menuByName.get(n) && menuByName.get(n).category === state.menuCategory); })
      .sort(function (a, b) { return (itemQty.get(b) || 0) - (itemQty.get(a) || 0); });
    const itemsDetails = el("details", { class: "table-view", open: itemNames.length ? undefined : null });
    itemsDetails.appendChild(el("summary", null, "Item table — units/orders/revenue scoped to filters; quadrant, trend and 12-week sparkline are full history"));
    const iscroll = el("div", { class: "scroll" });
    const itable = el("table");
    const ihead = el("tr");
    const cols = categories.length ? ["Item", "Category", "Units", "Orders", "Revenue", "Price", "Quadrant", "Trend", "12wk"]
      : ["Item", "Units", "Orders", "Revenue", "Price", "Quadrant", "Trend", "12wk"];
    cols.forEach(function (h) { ihead.appendChild(el("th", null, h)); });
    itable.appendChild(el("thead")).appendChild(ihead);
    const itbody = el("tbody");
    itemNames.forEach(function (name) {
      const price = priceByName.get(name);
      const mrow = menuByName.get(name);
      const units = itemQty.get(name) || 0;
      const orders = itemOrders.get(name) || 0;
      const revenue = price && price.unit_price != null ? price.unit_price * units : null;
      const tr = el("tr");
      tr.appendChild(el("td", { style: "text-align:left" }, itemShortName(name)));
      if (categories.length) tr.appendChild(el("td", null, (mrow && mrow.category) || "—"));
      tr.appendChild(el("td", null, String(units)));
      tr.appendChild(el("td", null, String(orders)));
      tr.appendChild(el("td", null, revenue == null ? "price unknown" : moneyExact(revenue)));
      tr.appendChild(el("td", null, price && price.unit_price != null ? moneyExact(price.unit_price) : "—"));
      tr.appendChild(el("td", null, mrow ? mrow.quadrant : "—"));
      tr.appendChild(el("td", null, trendCellText(mrow)));
      const sparkTd = el("td");
      sparkTd.appendChild(sparkline(mrow ? mrow.weekly_units : []));
      tr.appendChild(sparkTd);
      itbody.appendChild(tr);
    });
    itable.appendChild(itbody);
    iscroll.appendChild(itable);
    itemsDetails.appendChild(iscroll);
    body.appendChild(itemsDetails);
  }

  /* ---------- Combos ---------- */

  function renderCombos(body) {
    if (!A) { body.appendChild(emptyCard("Combos", "Pairs, attach rates and suggested bundles.")); return; }
    const menuByName = new Map((A.menu || []).map(function (m) { return [m.item_name, m]; }));
    const categoryOf = function (name) { const m = menuByName.get(name); return m && m.category; };
    const categories = Array.from(new Set((A.menu || []).map(function (m) { return m.category; }).filter(Boolean))).sort();
    const inCategory = function (name) { return state.comboCategory === "all" || categoryOf(name) === state.comboCategory; };

    const pairs = (A.pairs || []).filter(function (p) { return inCategory(p.a) || inCategory(p.b); });
    const attach = (A.attach || []).filter(function (a) { return inCategory(a.main_item); });
    const gapTotal = sum(attach.map(function (a) { return a.gap_value || 0; }));
    body.appendChild(heroBlock("Attach-rate opportunity left on the table", moneyExact(gapTotal),
      el("div", { class: "delta" }, attach.length + " mains tracked · basket data is thin (51 of 273 orders carry more than one item)")));
    body.appendChild(quietNote());
    const psl = priceSourceLine();
    if (psl) body.appendChild(psl);
    const catChips = categoryChips(categories, "comboCategory");
    if (catChips) body.appendChild(catChips);

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    const pairCard = card("Item pairs", "n < 5 is indicative, never rendered without its count.", "full");
    if (pairs.length) {
      const scroll = el("div", { class: "scroll" });
      const table = el("table");
      const head = el("tr");
      ["Pair", "n", "Lift", "Strength", "Combined price", "Suggested combo"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(el("thead")).appendChild(head);
      const tbody = el("tbody");
      pairs.slice(0, 15).forEach(function (p) {
        const tr = el("tr");
        tr.appendChild(el("td", { style: "text-align:left" }, itemShortName(p.a) + " + " + itemShortName(p.b)));
        tr.appendChild(el("td", null, String(p.n)));
        const liftTd = el("td");
        if (p.lift != null) {
          liftTd.appendChild(document.createTextNode(num(p.lift, 2) + "×"));
          // reads_as may not exist yet in older payloads — code defensively.
          if (p.lift < 1 && p.reads_as) {
            liftTd.appendChild(el("span", { class: "reads-as" }, p.reads_as));
          }
        } else {
          liftTd.textContent = "—";
        }
        tr.appendChild(liftTd);
        const stTd = el("td");
        stTd.appendChild(el("span", { class: "strength-chip " + p.strength }, p.strength));
        tr.appendChild(stTd);
        tr.appendChild(el("td", null, p.combined_value != null ? moneyExact(p.combined_value) : "—"));
        tr.appendChild(el("td", null, p.suggested_combo_price != null ? moneyExact(p.suggested_combo_price) : "—"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      pairCard.appendChild(scroll);
    } else {
      pairCard.appendChild(el("p", { class: "empty" }, "No pairs with n ≥ 2 in this build."));
    }
    grid.appendChild(pairCard);

    const attachSorted = attach.slice().sort(function (a, b) { return (b.gap_value || 0) - (a.gap_value || 0); });
    const attachCard = card("Attach rate per main", "Share of a main's orders that also carry a side — ranked by opportunity value, not rate, so a thin-sample item can't outrank the main that matters. Order count in parentheses.");
    attachCard.appendChild(attachSorted.length
      ? barChart({
          rows: attachSorted.map(function (a) { return {
            label: itemShortName(a.main_item) + " (" + a.orders + ")", value: a.attach_rate,
            tipRows: [
              { value: pct(a.attach_rate, 1), color: "var(--series-3)" },
              { value: a.orders + " orders", name: "" },
              { value: moneyExact(a.gap_value), name: "opportunity/mo" }
            ]
          }; }),
          fmt: function (v) { return pct(v, 0); }, color: "var(--series-3)", compact: true
        })
      : el("p", { class: "empty" }, "No mains tracked."));
    grid.appendChild(attachCard);

    const comboCard = card("Suggested combos", "Priced at 0.9× the sum of the two items, rounded to the nearest ₹10.");
    const comboList = el("div", { class: "actions-list" });
    pairs.filter(function (p) { return p.suggested_combo_price != null; }).slice(0, 6).forEach(function (p) {
      const box = el("div", { class: "action-card" });
      box.appendChild(el("div", { class: "kind" }, "combo"));
      box.appendChild(el("div", { class: "headline" }, itemShortName(p.a) + " + " + itemShortName(p.b)));
      box.appendChild(el("div", { class: "impact" }, moneyExact(p.suggested_combo_price)));
      box.appendChild(el("div", { class: "evidence" }, "n=" + p.n + " co-orders, " + p.strength));
      const foot = el("div", { class: "foot" });
      foot.appendChild(el("span", { class: "strength-chip " + p.strength }, p.strength));
      box.appendChild(foot);
      comboList.appendChild(box);
    });
    if (!comboList.children.length) comboCard.appendChild(el("p", { class: "empty" }, "No priced pairs to combo yet."));
    comboCard.appendChild(comboList);
    grid.appendChild(comboCard);

    const discounts = A.discounts || [];
    const discCard = card("Which offers pay for themselves", "Net revenue after the discount the restaurant funded.", "full");
    if (discounts.length) {
      const scroll = el("div", { class: "scroll" });
      const table = el("table");
      const head = el("tr");
      ["Offer", "Orders", "Avg order", "Discount funded", "Net revenue", "Repeat rate", "Verdict"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(el("thead")).appendChild(head);
      const tbody = el("tbody");
      discounts.slice(0, 10).forEach(function (d) {
        const tr = el("tr");
        tr.appendChild(el("td", { style: "text-align:left" }, d.construct || "—"));
        tr.appendChild(el("td", null, String(d.orders)));
        tr.appendChild(el("td", null, moneyExact(d.aov)));
        tr.appendChild(el("td", null, moneyExact(d.discount_funded)));
        tr.appendChild(el("td", null, moneyExact(d.net_revenue)));
        tr.appendChild(el("td", null, pct(d.repeat_rate, 0)));
        tr.appendChild(el("td", { style: "text-align:left; white-space: normal;" }, d.verdict || "—"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      discCard.appendChild(scroll);
    } else {
      discCard.appendChild(el("p", { class: "empty" }, "No discount constructs recorded."));
    }
    grid.appendChild(discCard);
  }

  /* ---------- Customers ---------- */

  function renderCustomers(body, rows) {
    if (!A) { body.appendChild(emptyCard("Customers", "RFM, cohorts, win-back list.")); return; }
    const c = A.customers || {};
    const trend = c.repeat_rate_trend || [];
    const lastShare = trend.length ? trend[trend.length - 1].repeat_share : null;
    body.appendChild(heroBlock("Repeat order rate, most recent active week", pct(lastShare, 0),
      el("div", { class: "delta" }, "overall repeat rate has run around 14% across the full history")));
    body.appendChild(quietNote());

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    const rfmCard = card("RFM segments", "champion ≥3 orders/≤30d · loyal ≥2/≤60d · promising 1/≤30d · at_risk ≥2/61-120d · lost >120d.");
    rfmCard.appendChild((c.rfm || []).length
      ? barChart({
          rows: (c.rfm || []).map(function (s) { return { label: s.segment, value: s.customers, tipRows: [
            { value: s.customers + " customers", color: "var(--series-1)" },
            { value: moneyExact(s.revenue), name: "revenue" },
            { value: num(s.avg_orders, 1), name: "avg orders" }
          ] }; }),
          fmt: function (v) { return num(v); }, compact: true
        })
      : el("p", { class: "empty" }, "No RFM segments in this build."));
    grid.appendChild(rfmCard);

    const cohortCard = card("Cohort retention", "Share of each signup month's customers who came back within 30/60/90 days.");
    cohortCard.appendChild(cohortGrid(c.cohorts || []));
    grid.appendChild(cohortCard);

    const splitCard = card("New vs returning revenue, by week", "Delivered revenue split by whether the customer had ordered before.", "full");
    const split = c.weekly_split || [];
    splitCard.appendChild(legend([
      { name: "New customers", color: "var(--series-1)" },
      { name: "Returning customers", color: "var(--series-3)" }
    ]));
    splitCard.appendChild(stackedColumnChart({
      labels: split.map(function (w) { return shortDate(new Date(w.week_start)); }),
      series: [
        { name: "New", color: "var(--series-1)", values: split.map(function (w) { return w.new_revenue; }) },
        { name: "Returning", color: "var(--series-3)", values: split.map(function (w) { return w.returning_revenue; }) }
      ],
      fmt: money, labelEvery: Math.max(1, Math.ceil(split.length / 8))
    }));
    grid.appendChild(splitCard);

    const trendCard = card("Repeat-rate trend", "Share of each week's orders placed by a returning customer.", "full");
    trendCard.appendChild(lineChart({
      // niceMax assumes display-scale values (see its integer-step rule), so feed it
      // percentage points (0-100) rather than the raw 0-1 fraction.
      labels: trend.map(function (w) { return shortDate(new Date(w.week_start)); }),
      series: [{ name: "repeat share", color: "var(--series-1)", values: trend.map(function (w) { return w.repeat_share == null ? null : w.repeat_share * 100; }) }],
      fmt: function (v) { return Math.round(v) + "%"; }, labelEvery: Math.max(1, Math.ceil(trend.length / 8))
    }));
    grid.appendChild(trendCard);

    const perCustomer = new Map();
    rows.forEach(function (o) { perCustomer.set(o.customer_id, (perCustomer.get(o.customer_id) || 0) + 1); });
    const buckets = [
      { label: "1 order", test: function (n) { return n === 1; } },
      { label: "2 orders", test: function (n) { return n === 2; } },
      { label: "3–4", test: function (n) { return n >= 3 && n <= 4; } },
      { label: "5+", test: function (n) { return n >= 5; } }
    ];
    const loyaltyCard = card("Order frequency in this range", perCustomer.size + " unique customers — scoped to the filters above, not the full history.");
    loyaltyCard.appendChild(columnChart({
      rows: buckets.map(function (b) {
        let count = 0;
        perCustomer.forEach(function (n) { if (b.test(n)) count++; });
        return { label: b.label, value: count, tipHead: b.label, tipRows: [{ value: count + " customers", color: "var(--series-1)" }] };
      }),
      fmt: function (v) { return num(v); }, valueLabels: true, compact: true
    }));
    grid.appendChild(loyaltyCard);

    const wbCard = card("Win-back list", "≥2 orders, last order 45+ days ago, ranked by lifetime spend.", "full");
    const winback = c.winback || [];
    if (winback.length) {
      const scroll = el("div", { class: "scroll" });
      const table = el("table");
      const head = el("tr");
      ["Customer", "Orders", "Spend", "Last order", "Days since", "Favourite item"].forEach(function (h) { head.appendChild(el("th", null, h)); });
      table.appendChild(el("thead")).appendChild(head);
      const tbody = el("tbody");
      winback.slice(0, 20).forEach(function (w) {
        const tr = el("tr");
        tr.appendChild(el("td", { style: "text-align:left" }, w.customer_id.slice(0, 10) + "…"));
        tr.appendChild(el("td", null, String(w.orders)));
        tr.appendChild(el("td", null, moneyExact(w.spend)));
        tr.appendChild(el("td", null, shortDate(new Date(w.last_order_at))));
        tr.appendChild(el("td", null, String(w.days_since)));
        tr.appendChild(el("td", { style: "text-align:left" }, w.favourite_item ? itemShortName(w.favourite_item) : "—"));
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      scroll.appendChild(table);
      wbCard.appendChild(scroll);
    } else {
      wbCard.appendChild(el("p", { class: "empty" }, "No lapsed repeat customers in this build."));
    }
    grid.appendChild(wbCard);
  }

  /* ---------- Quality ---------- */

  function renderQuality(body, rows) {
    const q = A && A.quality || null;
    const drivers = q && q.rating_drivers || [];
    const slowDriver = drivers.find(function (d) { return d.bucket && d.bucket.indexOf(">25") !== -1; });
    const fastDriver = drivers.find(function (d) { return d.bucket && d.bucket.indexOf("<=25") !== -1; });
    const delta = slowDriver && fastDriver && slowDriver.avg_rating != null && fastDriver.avg_rating != null
      ? slowDriver.avg_rating - fastDriver.avg_rating : null;
    body.appendChild(heroBlock(
      "Rating penalty for prep over 25 minutes",
      delta != null ? num(delta, 2) + "★" : "—",
      el("div", { class: "delta" },
        slowDriver ? num(slowDriver.avg_rating, 2) + "★ across " + slowDriver.n + " slow orders vs " + num(fastDriver.avg_rating, 2) + "★ across " + fastDriver.n + " fast ones" : "")
    ));

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    if (q) {
      body.insertBefore(quietNote("Funnel, drivers, slow-order and loss-reason cards below cover the full history, not the filters above."), grid);

      const funnelCard = card("Fulfilment funnel", "");
      funnelCard.appendChild(columnChart({
        rows: (q.funnel || []).map(function (s) { return { label: s.stage, value: s.orders, tipHead: s.stage, tipRows: [
          { value: s.orders + " orders", color: "var(--series-1)" }, { value: pct(s.pct, 0), name: "of placed" }
        ] }; }),
        fmt: function (v) { return num(v); }, valueLabels: true, compact: true
      }));
      grid.appendChild(funnelCard);

      const driverCard = card("Rating drivers", "Prep time is the single biggest driver of low ratings in this data. Grouped by factor; n is the order count behind each bar — a bar built on n=1 is a data point, not a finding.");
      if (drivers.length) {
        // factor may not exist in older payloads — fall back to one group so
        // this degrades to the previous flat-list rendering instead of breaking.
        const grouped = new Map();
        drivers.forEach(function (d) {
          const key = d.factor || "prep time";
          if (!grouped.has(key)) grouped.set(key, []);
          grouped.get(key).push(d);
        });
        grouped.forEach(function (list, factor) {
          // factor arrives as a snake_case key ("rider_wait"); read it as words.
          driverCard.appendChild(el("p", { class: "eyebrow", style: "margin-top:14px" },
            factor.replace(/_/g, " ")));
          driverCard.appendChild(barChart({
            rows: list.map(function (d) { return { label: d.bucket + " · n=" + d.n, value: d.avg_rating || 0, tipRows: [
              { value: num(d.avg_rating, 2) + "★", color: "var(--series-2)" }, { value: d.n + " orders", name: "" }
            ] }; }),
            fmt: function (v) { return num(v, 2); }, color: "var(--series-2)", compact: true
          }));
        });
      } else {
        driverCard.appendChild(el("p", { class: "empty" }, "No rating driver data."));
      }
      grid.appendChild(driverCard);

      const slow = q.slow_orders || {};
      const slowCard = card("Slow-order items", "Items most often present in orders over " + (slow.threshold_min || 25) + " minutes prep.", "full");
      slowCard.appendChild((slow.items || []).length
        ? barChart({
            rows: slow.items.map(function (i) { return { label: itemShortName(i.item_name), value: i.n, tipRows: [
              { value: i.n + " slow orders", color: "var(--series-2)" }, { value: num(i.avg_kpt, 1) + " min avg", name: "" }
            ] }; }),
            fmt: function (v) { return num(v); }, color: "var(--series-2)"
          })
        : el("p", { class: "empty" }, "No slow-order item data."));
      grid.appendChild(slowCard);

      const lossCard = card("Loss reasons", "Value of orders lost by reason.");
      lossCard.appendChild((q.loss_reasons || []).length
        ? barChart({
            rows: q.loss_reasons.map(function (l) { return { label: l.reason, value: l.lost_value, tipRows: [
              { value: moneyExact(l.lost_value), color: "var(--series-2)" }, { value: l.n + " orders", name: "" }
            ] }; }),
            fmt: money, color: "var(--series-2)", compact: true
          })
        : el("p", { class: "empty" }, "No lost orders in this build."));
      grid.appendChild(lossCard);
    } else {
      grid.appendChild(emptyCard("Fulfilment funnel", ""));
      grid.appendChild(emptyCard("Rating driver: prep time", ""));
    }

    const wk = weeks(rows);
    const wkLabels = wk.map(function (w) { return shortDate(w.start); });
    const wkEvery = Math.max(1, Math.ceil(wk.length / 8));

    const opsCard = card("Kitchen prep time and rider wait, by week", "Scoped to the filters above. Both in minutes.", "full");
    opsCard.appendChild(legend([
      { name: "Kitchen prep time", color: "var(--series-1)", line: true },
      { name: "Rider wait", color: "var(--series-2)", line: true }
    ]));
    opsCard.appendChild(lineChart({
      labels: wkLabels,
      series: [
        { name: "prep", color: "var(--series-1)", values: wk.map(function (w) { return mean(w.rows.map(function (o) { return o.kpt_duration_min; })); }) },
        { name: "rider wait", color: "var(--series-2)", values: wk.map(function (w) { return mean(w.rows.map(function (o) { return o.rider_wait_min; })); }) }
      ],
      fmt: function (v) { return num(v, 1) + "m"; }, labelEvery: wkEvery
    }));
    grid.appendChild(opsCard);

    const rated = rows.filter(function (o) { return o.rating != null; });
    const ratingCard = card("Ratings given", rated.length + " of " + rows.length + " orders rated in this range.");
    const ratingCounts = countBy(rated, function (o) { return Math.round(o.rating); });
    ratingCard.appendChild(columnChart({
      rows: [1, 2, 3, 4, 5].map(function (r) { return {
        label: r + "★", value: ratingCounts.get(r) || 0, tipHead: r + " star",
        tipRows: [{ value: (ratingCounts.get(r) || 0) + " orders", color: "var(--series-1)" }]
      }; }),
      fmt: function (v) { return num(v); }, valueLabels: true, compact: true
    }));
    grid.appendChild(ratingCard);

    const lost = rows.filter(function (o) { return !o.delivered; });
    const lossLiveCard = card("Why orders were lost, in this range", lost.length + " of " + rows.length + " orders did not reach the customer.");
    const lossCounts = countBy(lost, function (o) { return o.cancellation_reason || o.order_status; });
    const lossRows = Array.from(lossCounts.entries()).sort(function (a, b) { return b[1] - a[1]; });
    lossLiveCard.appendChild(lossRows.length
      ? barChart({
          rows: lossRows.map(function (e) { return { label: e[0], value: e[1] }; }),
          fmt: function (v) { return num(v); }, color: "var(--series-2)", compact: true
        })
      : el("p", { class: "empty" }, "No lost orders in this range."));
    grid.appendChild(lossLiveCard);
  }

  /* ---------- Demand ---------- */

  function renderDemand(body, rows, m) {
    const prev = previousWindow(rows);
    let deltaNode = null;
    if (prev && prev.rows.length) {
      const before = metrics(prev.rows).orders;
      const change = before ? (m.orders - before) / before : null;
      deltaNode = el("div", { class: "delta" });
      if (change != null) {
        const arrow = el("strong", { class: change >= 0 ? "up" : "down" }, (change >= 0 ? "↑ " : "↓ ") + pct(Math.abs(change)));
        deltaNode.appendChild(arrow);
        deltaNode.appendChild(document.createTextNode(" vs prior period"));
      }
    }
    body.appendChild(heroBlock("Orders in range", m.orders.toLocaleString("en-IN"), deltaNode));

    const grid = el("div", { class: "grid" });
    body.appendChild(grid);

    /* live weekday × hour heatmap, switchable measure */
    const heatCells = [];
    const cellMap = new Map();
    rows.forEach(function (o) {
      const key = o.weekday + ":" + o.hour;
      if (!cellMap.has(key)) cellMap.set(key, { weekday: o.weekday, hour: o.hour, orders: 0, revenue: 0, kpts: [] });
      const c = cellMap.get(key);
      c.orders += 1;
      if (o.delivered) c.revenue += o.total || 0;
      if (o.kpt_duration_min != null) c.kpts.push(o.kpt_duration_min);
    });
    cellMap.forEach(function (c) { heatCells.push(c); });
    const hours = Array.from(new Set(heatCells.map(function (c) { return c.hour; }))).sort(function (a, b) { return a - b; });
    const quietSet = new Set();
    if (A && A.demand && A.demand.quiet_windows) {
      A.demand.quiet_windows.forEach(function (q) {
        const wi = wdIndex(q.weekday);
        for (let h = q.hour_start; h < q.hour_end; h++) quietSet.add(wi + ":" + h);
      });
    }

    const heatCard = card("When orders come in", "Scoped to the filters above. Dashed outline marks maintenance-window candidates from the full history.", "full");
    const controls = el("div", { class: "heatmap-controls" });
    const measures = [
      { key: "orders", label: "Orders", fmt: function (v) { return num(v); } },
      { key: "revenue", label: "Revenue", fmt: money },
      { key: "kpt", label: "Avg prep time", fmt: function (v) { return num(v, 1) + "m"; } }
    ];
    let activeMeasure = "orders";
    const heatBody = el("div");
    function paintHeat() {
      heatBody.textContent = "";
      const spec = measures.find(function (x) { return x.key === activeMeasure; });
      const values = heatCells.map(function (c) {
        const avgKpt = c.kpts.length ? mean(c.kpts) : null;
        return activeMeasure === "orders" ? c.orders : activeMeasure === "revenue" ? c.revenue : (avgKpt || 0);
      });
      const maxValue = values.length ? Math.max.apply(null, values) : 0;
      heatBody.appendChild(heatmapLegend(spec.label, maxValue, spec.fmt));
      heatBody.appendChild(heatmapChart({
        cells: heatCells.map(function (c) {
          const avgKpt = c.kpts.length ? mean(c.kpts) : null;
          const value = activeMeasure === "orders" ? c.orders : activeMeasure === "revenue" ? c.revenue : (avgKpt || 0);
          return {
            weekday: c.weekday, hour: c.hour, value: value,
            quiet: quietSet.has(c.weekday + ":" + c.hour),
            tipHead: WEEKDAYS[c.weekday] + " " + hourLabel(c.hour),
            tipRows: [
              { value: c.orders + " orders", color: "var(--series-1)" },
              { value: moneyExact(c.revenue), name: "revenue" },
              { value: avgKpt == null ? "—" : num(avgKpt, 1) + "m", name: "avg prep" }
            ]
          };
        }),
        hours: hours
      }));
    }
    measures.forEach(function (spec) {
      const b = el("button", { class: "chip", type: "button" }, spec.label);
      b.setAttribute("aria-pressed", String(spec.key === activeMeasure));
      b.addEventListener("click", function () {
        activeMeasure = spec.key;
        Array.prototype.forEach.call(controls.children, function (btn, i) { btn.setAttribute("aria-pressed", String(measures[i].key === activeMeasure)); });
        paintHeat();
      });
      controls.appendChild(b);
    });
    heatCard.appendChild(controls);
    heatCard.appendChild(heatBody);
    paintHeat();
    grid.appendChild(heatCard);

    if (A && A.demand) {
      body.insertBefore(quietNote("Peak/quiet windows and closure options below cover the full history, not the filters above."), grid);

      const peakCard = card("Peak windows", "Contiguous top-quartile hour runs, per weekday.");
      const peaks = A.demand.peak_windows || [];
      peakCard.appendChild(peaks.length
        ? barChart({
            rows: peaks.map(function (p) { return { label: p.weekday + " " + hourLabel(p.hour_start) + "–" + hourLabel(p.hour_end), value: p.orders, tipRows: [
              { value: p.orders + " orders", color: "var(--series-1)" }, { value: pct(p.share, 0), name: "of that weekday" }
            ] }; }),
            fmt: function (v) { return num(v); }, compact: true
          })
        : el("p", { class: "empty" }, "No peak windows in this build."));
      grid.appendChild(peakCard);

      const quietCard = card("Quiet windows", "Maintenance-window candidates — bottom-decile, ≥2 contiguous hours.");
      const quiets = A.demand.quiet_windows || [];
      quietCard.appendChild(quiets.length
        ? barChart({
            rows: quiets.map(function (q) { return { label: q.weekday + " " + hourLabel(q.hour_start) + "–" + hourLabel(q.hour_end), value: q.monthly_revenue_at_risk, tipRows: [
              { value: moneyExact(q.monthly_revenue_at_risk) + "/mo at risk", color: "var(--series-3)" }, { value: q.orders + " orders historically", name: "" }
            ] }; }),
            fmt: money, color: "var(--series-3)", compact: true
          })
        : el("p", { class: "empty" }, "No quiet windows in this build."));
      grid.appendChild(quietCard);

      const closureCard = card("Kitchen-closure options", "", "full");
      ["weekly", "weekday", "monthly"].forEach(function (scope) {
        closureCard.appendChild(el("p", { class: "eyebrow", style: "margin-top:14px" }, scope));
        closureCard.appendChild(closureOptionsTable(A.demand.closure_options, scope));
      });
      grid.appendChild(closureCard);
    }
  }

  /* ---------- tab dispatch ---------- */

  // Which tabs answer the filters, and which are built once over the whole
  // history at build time. Stated here rather than discovered by clicking.
  const TAB_SCOPE = {
    plan:      "The weekly history chart and the range figures follow the filters. The forecast and the channel split are whole-history by design.",
    menu:      "Units, orders and revenue in the item table follow the filters. The matrix, quadrants and trends are whole-history.",
    combos:    "Whole-history only — pair strength needs every order, and a 7-day window has too few pairs to mean anything.",
    customers: "Order frequency in this range follows the filters. Segments and lifetime values are whole-history.",
    // Corrected after reading the page: the Quality hero is the full-history
    // prep-time penalty, and every card under it says so in its own note.
    quality:   "Whole-history — the funnel, rating drivers, slow-order items and loss reasons all need the full record.",
    demand:    "The heatmap and the range figures follow the filters. Quiet windows and closure options are whole-history."
  };

  function renderSelectionBar(rows, m) {
    const bar = document.getElementById("selection-bar");
    bar.textContent = "";
    const add = function (label, value, cls) {
      const wrap = el("span", null);
      wrap.appendChild(el("span", { class: "figure" + (cls ? " " + cls : "") }, value));
      wrap.appendChild(document.createTextNode(" " + label));
      bar.appendChild(wrap);
    };
    add("Zomato orders selected", num(m.orders, 0));
    add("delivered revenue", moneyExact(m.revenue));
    if (m.aov != null) add("average order", moneyExact(m.aov));
    bar.appendChild(el("span", null, shortDate(state.from) + " – " + shortDate(state.to)
      + (state.weekdays.length < 7 ? " · " + state.weekdays.map(function (d) { return WEEKDAYS[d]; }).join(" ") : "")
      + (state.status !== "all" ? " · " + (state.status === "Delivered" ? "delivered only" : "not delivered") : "")));
    const scope = TAB_SCOPE[state.tab];
    if (scope) bar.appendChild(el("span", { class: "scope-warn" }, scope));
  }

  function render() {
    const rows = selection();
    const m = metrics(rows);
    renderSelectionBar(rows, m);
    const body = document.getElementById("body");
    body.textContent = "";

    if (state.tab === "plan") renderPlan(body, rows);
    else if (state.tab === "menu") renderMenu(body, rows);
    else if (state.tab === "combos") renderCombos(body);
    else if (state.tab === "customers") renderCustomers(body, rows);
    else if (state.tab === "quality") renderQuality(body, rows);
    else if (state.tab === "demand") renderDemand(body, rows, m);

    if (!rows.length) {
      const note = el("p", { class: "empty" }, "No orders match the current filters.");
      body.insertBefore(note, body.firstChild);
    }

    /* filter chrome state */
    Array.prototype.forEach.call(document.querySelectorAll("#range-presets button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.key === state.preset));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#weekday-picker button"), function (b) {
      b.setAttribute("aria-pressed", String(state.weekdays.indexOf(Number(b.dataset.day)) !== -1));
    });
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function (b) {
      b.setAttribute("aria-selected", String(b.dataset.tab === state.tab));
    });
    document.getElementById("from").value = isoDate(state.from);
    document.getElementById("to").value = isoDate(state.to);
  }

  /* ---------- boot ---------- */

  const meta = DATA.meta;
  document.getElementById("title").textContent = meta.restaurant_name || "Restaurant";
  document.getElementById("subtitle").textContent =
    [meta.subzone, meta.city].filter(Boolean).join(", ") +
    // "302 orders" read as the whole business. Every chart here is built from
    // silver.orders, which is the Zomato export alone -- direct orders appear
    // only in the Direct vs Zomato card, which says so.
    " · " + meta.order_count + " Zomato orders · " +
    longDate(FIRST_DAY) + " – " + longDate(LAST_DAY);
  document.getElementById("footer").textContent =
    "Built from the bronze → silver → gold DuckDB warehouse. Data generated " +
    new Date(DATA.generated_at).toLocaleString("en-GB") + ".";

  const presetRow = document.getElementById("range-presets");
  PRESETS.forEach(function (p) {
    const b = el("button", { class: "chip", type: "button" }, p.label);
    b.dataset.key = p.key;
    b.addEventListener("click", function () { applyPreset(p.key); render(); });
    presetRow.appendChild(b);
  });

  const weekdayRow = document.getElementById("weekday-picker");
  WEEKDAYS.forEach(function (name, i) {
    const b = el("button", { class: "chip", type: "button" }, name);
    b.dataset.day = String(i);
    b.setAttribute("aria-pressed", "true");
    b.addEventListener("click", function () {
      const idx = state.weekdays.indexOf(i);
      if (idx === -1) {
        state.weekdays.push(i);
      } else if (state.weekdays.length > 1) {
        state.weekdays.splice(idx, 1);
      }
      render();
    });
    weekdayRow.appendChild(b);
  });

  const tabsRow = document.getElementById("tabs");
  TABS.forEach(function (t) {
    const b = el("button", { type: "button", role: "tab" }, t.label);
    b.dataset.tab = t.key;
    b.addEventListener("click", function () { state.tab = t.key; render(); });
    tabsRow.appendChild(b);
  });

  document.getElementById("from").addEventListener("change", function (ev) {
    if (!ev.target.value) return;
    state.from = new Date(ev.target.value + "T00:00:00");
    state.preset = "custom";
    render();
  });
  document.getElementById("to").addEventListener("change", function (ev) {
    if (!ev.target.value) return;
    state.to = new Date(ev.target.value + "T00:00:00");
    state.preset = "custom";
    render();
  });
  document.getElementById("status").addEventListener("change", function (ev) {
    state.status = ev.target.value;
    render();
  });

  applyPreset("all");
  render();
  window.addEventListener("resize", function () {
    Array.prototype.forEach.call(document.querySelectorAll(".tip"), function (t) { t.style.opacity = "0"; });
  });
})();
</script>
